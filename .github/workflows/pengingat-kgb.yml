# Memanggil endpoint pengingat KGB empat kali sehari: sekitar 08.07, 09.07, 11.07, dan 15.07 WIB.
# (Menit 7 dipilih agar tidak bentrok dengan antrean GitHub yang padat di jam bulat.)
# (Vercel gratis hanya boleh menjadwalkan sekali sehari, jadi jam tambahan dijalankan dari sini.)
# Isi Secrets di GitHub: Settings > Secrets and variables > Actions
#   APP_URL     = https://sitepat-bps.vercel.app   (tanpa garis miring di akhir)
#   CRON_SECRET = sama persis dengan CRON_SECRET di Vercel
name: Pengingat KGB

on:
  schedule:
    - cron: '7 1 * * *'   # sekitar 08.07 WIB
    - cron: '7 2 * * *'   # sekitar 09.07 WIB
    - cron: '7 4 * * *'   # sekitar 11.07 WIB
    - cron: '7 8 * * *'   # sekitar 15.07 WIB
  workflow_dispatch: {}   # tombol "Run workflow" untuk mencoba manual

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint pengingat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/kgb"
